[project]
name = "frit"
version = "0.1.0"
description = "A minimal frp-like TCP tunnel with self-built symmetric encryption"
requires-python = ">=3.10"
dependencies = [
    "pycryptodome>=3.20",
]

[project.scripts]
frit = "frit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frit"]
